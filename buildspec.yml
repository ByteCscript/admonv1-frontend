version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm ci

  build:
    commands:
      - echo "Building frontend..."
      - npm run build

  post_build:
    commands:
      - echo "Build completed successfully"
      - ls -la dist

artifacts:
  base-directory: dist
  files:
    - '**/*'